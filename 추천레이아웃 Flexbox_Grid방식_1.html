<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 레이아웃 샘플</title>
    <style>
        /* 전체 레이아웃: Grid 사용 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            min-height: 100vh;
        }

        /* 헤더 */
        header {
            grid-area: header;
            background-color: #fff;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* 상단 메뉴: Flexbox 사용 */
        nav .top-menu {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 1rem;
        }

        nav .top-menu li a {
            display: block;
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: #333;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav .top-menu li a:hover {
            background-color: #ddd;
        }

        /* 사이드바 */
        aside {
            grid-area: sidebar;
            background-color: #eee;
            padding: 1rem;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside ul li a {
            display: block;
            padding: 0.5rem;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #ccc;
            transition: background-color 0.3s;
        }

        aside ul li a:hover {
            background-color: #ddd;
        }

        /* 메인 콘텐츠 */
        main {
            grid-area: main;
            padding: 1rem;
        }

        /* 푸터 */
        footer {
            grid-area: footer;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        /* 햄버거 버튼 스타일 */
        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* 모바일 뷰 스타일 */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                grid-template-areas:
                    "header"
                    "menu" /* 새로운 메뉴 영역 */
                    "main"
                    "footer";
            }

            aside {
                display: none;
                /* 기본적으로 숨김 */
            }

            header {
                display: flex;
                justify-content: space-between;
            }

            nav .top-menu {
                display: none;
            }

            .hamburger {
                display: block;
            }

            /* 새로운 모바일 메뉴 스타일 */
            nav.mobile-menu {
                grid-area: menu;
                background-color: #fff;
                padding: 1rem;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            nav.mobile-menu ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            nav.mobile-menu li a {
                display: block;
                padding: 0.5rem 1rem;
                text-decoration: none;
                color: #333;
                border-radius: 5px;
                transition: background-color 0.3s;
                border-bottom: 1px solid #eee; /* 구분선 추가 */
            }

            nav.mobile-menu li a:hover {
                background-color: #ddd;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="app">

        <header>
            <div class="logo">로고</div>
            <nav>
                <ul class="top-menu">
                    <li><a href="#" @click.prevent="showContent('home')">Home</a></li>
                    <li><a href="#" @click.prevent="showContent('about')">About</a></li>
                    <li><a href="#" @click.prevent="showContent('services')">Services</a></li>
                    <li><a href="#" @click.prevent="showContent('contact')">Contact</a></li>
                </ul>
            </nav>
            <div class="hamburger" @click="toggleMenu">☰</div>
        </header>

        <nav class="mobile-menu" v-if="showMobileMenu">
            <ul>
                <li><a href="#" @click.prevent="showContent('home'); toggleMenu()">Home</a></li>
                <li><a href="#" @click.prevent="showContent('about'); toggleMenu()">About</a></li>
                <li><a href="#" @click.prevent="showContent('services'); toggleMenu()">Services</a></li>
                <li><a href="#" @click.prevent="showContent('contact'); toggleMenu()">Contact</a></li>
            </ul>
        </nav>

        <aside>
            <ul>
                <li><a href="#" @click.prevent="showContent('home')">Home</a></li>
                <li><a href="#" @click.prevent="showContent('products')">Products</a></li>
                <li><a href="#" @click.prevent="showContent('pricing')">Pricing</a></li>
                <li><a href="#" @click.prevent="showContent('faq')">FAQ</a></li>
            </ul>
        </aside>

        <main>
            <h2 v-if="currentContent === 'home'">Home</h2>
            <h2 v-if="currentContent === 'about'">About</h2>
            <h2 v-if="currentContent === 'services'">Services</h2>
            <h2 v-if="currentContent === 'contact'">Contact</h2>
            <h2 v-if="currentContent === 'products'">Products</h2>
            <h2 v-if="currentContent === 'pricing'">Pricing</h2>
            <h2 v-if="currentContent === 'faq'">FAQ</h2>
            <p>컨텐츠 영역</p>
        </main>

        <footer>
            <p>&copy; 2026 테스트.</p>
        </footer>

    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    currentContent: 'home',
                    showMobileMenu: false
                }
            },
            methods: {
                showContent(content) {
                    this.currentContent = content
                },
                toggleMenu() {
                    this.showMobileMenu = !this.showMobileMenu
                }
            }
        }).mount('#app')
    </script>

</body>

</html>
