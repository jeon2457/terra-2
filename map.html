<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 모바일 화면 대응 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>장소검색 및 입력</title>

<!-- ✅ JavaScript 키 -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3409644aa1cb50eb41430562f5df97d2&libraries=services"></script>

<style>
/* 초기화 */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background: #f0f2f5;
  color: #333;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
  color: #2c3e50;
  font-size: 1.5rem;
}

/* 검색 폼 디자인 수정 (버튼 포함) */
.search-form {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

input[type="text"] {
  flex: 1;
  padding: 15px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ccc;
  outline: none;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

input[type="text"]:focus {
  border-color: #4a90e2;
}

/* 🔍 검색 버튼 스타일 */
.btn-search {
  background-color: #4a90e2;
  color: white;
  border: none;
  border-radius: 12px;
  width: 55px;
  cursor: pointer;
  font-size: 1.2rem;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: background 0.2s;
}

.btn-search:active {
  background-color: #357abd;
}

/* 검색 결과 리스트 */
#placesList {
  list-style: none;
  padding: 0;
  margin: 0 0 20px 0;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  max-height: 200px;
  overflow-y: auto;
  display: none;
  position: relative;
  z-index: 100;
}

#placesList li {
  padding: 15px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

#placesList li:last-child { border-bottom: none; }
#placesList li:hover { background-color: #f9f9f9; }

#placesList .place-name {
  font-weight: bold;
  font-size: 16px;
  color: #333;
  margin-bottom: 5px;
}

#placesList .place-addr {
  font-size: 13px;
  color: #777;
}

#placesList li.on {
  background-color: #e3f2fd;
  border-left: 5px solid #4a90e2;
}

/* 지도 박스 */
.map-box {
  background: white;
  padding: 5px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  min-height: 300px;
  margin-top: 20px;
  margin-bottom: 20px;
  position: relative;
  display: none; /* 초기에는 숨김 */
}

.map-box.show {
  display: block; /* 보이기 */
}

#map {
  width: 100%;
  height: 300px;
  border-radius: 10px;
}

/* 빈 지도 안내 메시지 */
.map-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 300px;
  color: #999;
  font-size: 1.1rem;
  text-align: center;
  padding: 40px;
  line-height: 1.8;
}

/* 하단 버튼들 */
.button-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: auto;
  padding-top: 20px;
}

.btn-link {
  display: block;
  width: 100%;
  text-align: center;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  text-decoration: none;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}

.btn-preview {
  background-color: #34c759;
  color: white;
}

.btn-preview:active {
  background-color: #2da94b;
  transform: translateY(2px);
}

.btn-preview:disabled {
  background-color: #ccc;
  cursor: not-allowed;
  opacity: 0.6;
}

.btn-send {
  background-color: #4a90e2;
  color: white;
  margin-top: 15px;
}

.btn-send:active {
  background-color: #357abd;
  transform: translateY(2px);
}

.btn-send:disabled {
  background-color: #ccc;
  cursor: not-allowed;
  opacity: 0.6;
}
</style>
</head>

<body>
<div class="container">
  
  <h2>
    <img src="image/location-30.png" alt="📍" width="30" height="30" style="vertical-align: middle;">
    장소/주소 검색
  </h2>

  <!-- 폼 제출 이벤트 리스너 변경 (JS에서 처리) -->
  <form class="search-form" id="searchForm">
    <input type="text" id="keyword" placeholder="건물명, 지명 입력 (예: 서울역)" autocomplete="off">
    <button type="submit" class="btn-search">🔍</button>
  </form>

  <!-- ✅ [추가] 모달 안내문 입력 -->
  <div style="margin-bottom:10px;">
    <div style="font-weight:bold;margin-bottom:5px;">모달창 생성 안내문</div>
    <textarea
      id="modalNotice"
      maxlength="500"
      rows="10"
      style="
        width:100%;
        padding:15px;
        font-size:16px;
        border-radius:12px;
        border:1px solid #ccc;
        resize:none;
        box-shadow:0 2px 5px rgba(0,0,0,0.05);
        text-align: left;
        white-space: pre-line;
      "
    >🎉 모임제목:
📅 모임날짜:
⏰ 시간:
📍 장소:
📢 전달사항:

📝 안내사항: 아래의 '카카오맵' / 'TMAP실행' 버튼을 클릭하면 네비게이션이 장소로 안내합니다.
앱이 설치되어있지않으면 설치 후 이용해주세요.</textarea>
  </div>

  <!-- 검색 결과 목록 -->
  <ul id="placesList"></ul>

  <!-- 지도 미리보기 박스 -->
  <div class="map-box" id="mapBox">
    <div id="map"></div>
  </div>

  <!-- 빈 상태 안내 -->
  <div class="map-placeholder" id="mapPlaceholder">
    📍 위의 검색창에서 장소를 검색하고<br>
    목록에서 선택한 후<br>
    "🗺️ 지도 미리보기" 버튼을 눌러주세요
  </div>

  <!-- 하단 버튼 그룹 -->
  <div class="button-group">
    <button class="btn-link btn-preview" id="btnPreview" onclick="showMapPreview()" disabled>
      🗺️ 지도 미리보기
    </button>
    <button class="btn-link btn-send" id="btnSend" onclick="goToMapView()" disabled>
      📤 이 위치로 지도 보내기
    </button>
  </div>

</div>

<script>
// 1. 지도 생성 (초기에는 생성만 하고 표시 안함)
const mapContainer = document.getElementById('map');
const mapOption = {
  center: new kakao.maps.LatLng(37.5665, 126.9780),
  level: 3
};

const map = new kakao.maps.Map(mapContainer, mapOption);
const marker = new kakao.maps.Marker({ map: map });

const ps = new kakao.maps.services.Places();
let selectedAddress = "";
let selectedCoords = null;
let isMapPreviewed = false;

// 🚀 [핵심 수정] 폼 제출 이벤트 리스너
document.getElementById('searchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  searchPlaces();
  document.getElementById('keyword').blur(); 
});

// ✅ [추가] 엔터키 이벤트 직접 처리
document.getElementById('keyword').addEventListener('keypress', function(e) {
  if (e.key === 'Enter' || e.keyCode === 13) {
    e.preventDefault();
    searchPlaces();
    this.blur();
  }
});

// 3. 키워드 검색 함수
function searchPlaces() {
  const keyword = document.getElementById('keyword').value.trim();

  if (!keyword) {
    alert('검색어를 입력해주세요!');
    return false;
  }

  ps.keywordSearch(keyword, placesSearchCB);
  document.getElementById('placesList').style.display = 'none';
}

// 4. 장소검색 콜백함수
function placesSearchCB(data, status, pagination) {
  if (status === kakao.maps.services.Status.OK) {
    displayPlaces(data);
  } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
    alert('검색 결과가 존재하지 않습니다.');
    return;
  } else if (status === kakao.maps.services.Status.ERROR) {
    alert('검색 결과 중 오류가 발생했습니다.');
    return;
  }
}

// 5. 검색 결과 목록 표출
function displayPlaces(places) {
  const listEl = document.getElementById('placesList');
  listEl.innerHTML = "";
  listEl.style.display = 'block';

  for (let i = 0; i < places.length; i++) {
    const itemEl = document.createElement('li');
    
    const addressName = places[i].road_address_name ? places[i].road_address_name : places[i].address_name;

    itemEl.innerHTML = `
      <div class="place-name">${places[i].place_name}</div>
      <div class="place-addr">${addressName}</div>
    `;

    itemEl.onclick = function() {
      // 좌표 저장
      selectedCoords = new kakao.maps.LatLng(places[i].y, places[i].x);
      
      // 선택 스타일
      const children = listEl.children;
      for(let j=0; j<children.length; j++) children[j].classList.remove('on');
      this.classList.add('on');

      // 저장용 주소 설정
      selectedAddress = addressName;
      
      // 입력창 업데이트
      document.getElementById('keyword').value = places[i].place_name;
      
      // 지도 미리보기 버튼 활성화
      document.getElementById('btnPreview').disabled = false;
      
      // 지도는 아직 안 보이고, 미리보기 버튼을 눌러야 보임
      isMapPreviewed = false;
      document.getElementById('btnSend').disabled = true;
    };

    listEl.appendChild(itemEl);
  }

  setTimeout(() => {
    listEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

// 6. 지도 미리보기 함수
function showMapPreview() {
  if (!selectedCoords) {
    alert("목록에서 장소를 먼저 선택해주세요!");
    return;
  }

  // 지도 박스 보이기
  document.getElementById('mapBox').classList.add('show');
  document.getElementById('mapPlaceholder').style.display = 'none';
  
  // 지도 중심 이동 및 마커 설정
  map.setCenter(selectedCoords);
  marker.setPosition(selectedCoords);
  
  // InfoWindow 표시
  new kakao.maps.InfoWindow({
    content: `<div style="width:150px;text-align:center;padding:6px 0;font-size:14px;">${selectedAddress}</div>`
  }).open(map, marker);
  
  // 지도 리사이즈 (제대로 보이도록)
  setTimeout(() => {
    map.relayout();
    map.setCenter(selectedCoords);
  }, 100);
  
  // 미리보기 완료 상태
  isMapPreviewed = true;
  document.getElementById('btnSend').disabled = false;
  
  // 지도로 스크롤
  setTimeout(() => {
    document.getElementById('mapBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 200);
}

// 7. 지도보기 버튼
function goToMapView() {
  if (!isMapPreviewed) {
    alert("먼저 '지도 미리보기' 버튼을 눌러 지도를 확인해주세요!");
    return;
  }

  if (!selectedAddress) {
    alert("장소를 선택해주세요!");
    return;
  }

  // 주소 저장
  const lat = selectedCoords.getLat();
const lng = selectedCoords.getLng();

const url = `map_view.html?addr=${encodeURIComponent(selectedAddress)}&lat=${lat}&lng=${lng}`;
location.href = url;


  // 모달 안내문 저장
  const noticeText = document.getElementById('modalNotice').value.trim();
  localStorage.setItem('modalNoticeText', noticeText);

  
}
</script>
</body>
</html>
