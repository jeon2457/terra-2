<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 모바일 화면 꽉 차게 설정 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🚗 찾아오는 길안내입니다.아래의 주소를 클릭하면 해당장소로 안내됩니다.</title>

<!-- ✅ 카카오맵 API 키 확인 필수 -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3409644aa1cb50eb41430562f5df97d2&libraries=services"></script>

<style>
/* CSS 초기화 */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  overflow: hidden;
}

.map-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

/* 내비게이션 버튼 박스 */
.navi-buttons {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 400px;
  display: none; /* 초기에는 숨김 */
  gap: 10px;
  z-index: 9999;
}

/* 공통 버튼 스타일 */
.btn-navi {
  flex: 1;
  padding: 12px; /* 패딩 약간 조절 */
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.2s;
  
  /* 🔥 [수정됨] 이미지와 텍스트 가로 정렬 */
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px; /* 이미지와 글자 사이 간격 */
  cursor: pointer;
}

.btn-navi:active {
  transform: scale(0.96);
}

/* 🔥 [추가됨] 버튼 내부 아이콘 이미지 스타일 */
.btn-icon {
  width: 24px;  /* 아이콘 크기 */
  height: 24px;
  object-fit: contain; /* 비율 유지 */
  border-radius: 4px; /* 모서리 살짝 둥글게 */
}

/* 카카오맵 (노랑) */
.btn-kakao {
  background-color: #FEE500;
  color: #3C1E1E;
  border: 1px solid #eecbf0;
}

/* TMAP (흰색/검정) */
.btn-tmap {
  background-color: #FFFFFF;
  color: #000000;
  border: 1px solid #ccc;
}

/* 모달창 스타일 (기존 유지) */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 10000;
  justify-content: center;
  align-items: center;
}
.modal-box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  width: 85%;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}
.modal-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #333; }
.modal-desc { 
  font-size: 14px; 
  color: #666; 
  margin-bottom: 20px; 
  line-height: 1.5;
  text-align: left;      /* ✅ 추가 */
  white-space: pre-line; /* ✅ 줄바꿈 유지 */ 
}
.modal-btns { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
.btn-cancel { background: #ff4d4d; color: white; }

</style>
</head>

<body>
<div class="map-wrapper">
  <div id="map"></div>

  <!-- 내비게이션 버튼 -->
  <div class="navi-buttons" id="naviBox">
    <!-- ✅ 카카오맵 버튼 (이미지 교체) -->
    <a href="#" id="kakaoLink" class="btn-navi btn-kakao" target="_blank">
      <img src="image/kakao_map.png" alt="kakao" class="btn-icon">
      카카오맵
    </a>
    
    <!-- ✅ TMAP 버튼 (이미지 교체) -->
    <div id="tmapLink" class="btn-navi btn-tmap" onclick="tryRunTmap()">
      <img src="image/t_map.jpg" alt="tmap" class="btn-icon">
      TMAP 실행
    </div>
  </div>
</div>

<!-- 안내 모달창 -->
<div id="tmapModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">📢 [안내]</div>
    <div class="modal-desc">
      TMAP 앱이 열리지 않으면 설치되어 있지 않습니다.<br>
      설치 페이지로 이동하시겠습니까?
    </div>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeModal()">닫기</button>

    </div>
  </div>
</div>


<script>
// ===============================
// 0. 안내문 불러오기 + 모달 표시
// ===============================
const noticeText = localStorage.getItem('modalNoticeText');

window.onload = function () {
  if (noticeText) {
    document.querySelector('.modal-desc').innerText = noticeText;
    showModal();
  }
};

// ===============================
// 1. URL 파라미터 읽기
// ===============================
const params = new URLSearchParams(window.location.search);
const address = params.get('addr');
const lat = params.get('lat');
const lng = params.get('lng');

if (!address) {
  alert('입력된 주소가 없습니다.');
  throw new Error('address parameter missing');
}

// ===============================
// 2. 지도 기본 설정
// ===============================
const mapContainer = document.getElementById('map');
const mapOption = {
  center: new kakao.maps.LatLng(37.5665, 126.9780),
  level: 3
};

const map = new kakao.maps.Map(mapContainer, mapOption);
const geocoder = new kakao.maps.services.Geocoder();
const marker = new kakao.maps.Marker({ map });

// 네비게이션 링크용
let tmapUrlScheme = "";

// ===============================
// 3. 지도 표시 함수 (공통)
// ===============================
function renderMap(lat, lng, address) {
  const coords = new kakao.maps.LatLng(Number(lat), Number(lng));

  map.setCenter(coords);
  marker.setPosition(coords);

  new kakao.maps.InfoWindow({
    content: `<div style="width:150px;text-align:center;padding:6px 0;font-size:14px;">
                ${address}
              </div>`
  }).open(map, marker);

  // 네비 버튼 설정
  const naviBox = document.getElementById('naviBox');
  const kakaoBtn = document.getElementById('kakaoLink');

  kakaoBtn.href = `https://map.kakao.com/link/to/${address},${lat},${lng}`;
  tmapUrlScheme = `tmap://route?goalname=${encodeURIComponent(address)}&goalx=${lng}&goaly=${lat}`;

  naviBox.style.display = 'flex';
}

// ===============================
// 4. 좌표 우선 → 없으면 주소 검색
// ===============================
if (lat && lng) {
  // ✅ URL에 좌표가 있는 경우 (공유 링크용, 가장 안정적)
  renderMap(lat, lng, address);

} else {
  // ✅ 좌표 없으면 주소 → 좌표 변환
  geocoder.addressSearch(address, function (result, status) {
    if (status === kakao.maps.services.Status.OK) {
      const foundLat = result[0].y;
      const foundLng = result[0].x;

      renderMap(foundLat, foundLng, address);
    } else {
      alert("주소 위치를 찾을 수 없습니다.");
    }
  });
}

// ===============================
// 5. TMAP 실행 로직
// ===============================
function tryRunTmap() {
  if (!tmapUrlScheme) return;

  const startTime = Date.now();
  location.href = tmapUrlScheme;

  setTimeout(() => {
    if (Date.now() - startTime < 2500) {
      showModal();
    }
  }, 1500);
}

// ===============================
// 6. 모달 제어
// ===============================
function showModal() {
  document.getElementById('tmapModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('tmapModal').style.display = 'none';
}

// ===============================
// 7. 스토어 이동
// ===============================
function goToStore() {
  const ua = navigator.userAgent.toLowerCase();

  if (ua.includes("android")) {
    location.href = "market://details?id=com.skt.tmap.ku";
  } else if (ua.includes("iphone") || ua.includes("ipad")) {
    location.href = "https://apps.apple.com/kr/app/tmap-%EB%8C%80%EC%A4%91%EA%B5%90%ED%86%B5-%EB%8C%80%EB%A6%AC%EC%9A%B4%EC%A0%84/id431589174";
  } else {
    alert("모바일 기기에서만 설치가 가능합니다.");
  }

  closeModal();
}
</script>


</body>
</html>
